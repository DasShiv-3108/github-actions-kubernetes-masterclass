name: DevSecOps Pipeline

on:
    workflow_dispatch:

        inputs:
    
          environment:
              description: where you want to deploy?
              default: 'Dev'
              required: true
              type: choice
              options:
                - Dev
                - Test
                - stage
                - Prod


jobs:

    Gitleaks:
        name: Git Secrets Scan
        uses: ./.github/workflows/gitleaks.yml
        

    Linting:
        needs: Gitleaks
        name: Check_Code_linting
        uses: ./.github/workflows/linting.yml
    

    Docker_Build_Push:
        needs: Linting
        name: Docker_Build_Push
        uses: ./.github/workflows/docker_Build_Push.yml
        secrets: inherit