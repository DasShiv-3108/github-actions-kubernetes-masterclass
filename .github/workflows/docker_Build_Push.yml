name: Docker_Build_Scan_Push

on:
  workflow_call: 

jobs:
  docker:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [frontend, backend]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: |
            ${{ secrets.DOCKERHUB_USER }}/${{ matrix.service }}-app:latest

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ secrets.DOCKERHUB_USER }}/${{ matrix.service }}-app:latest
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USER }}/${{ matrix.service }}-SkillPulse:latest
            ${{ secrets.DOCKERHUB_USER }}/${{ matrix.service }}-SkillPuslse:latest
